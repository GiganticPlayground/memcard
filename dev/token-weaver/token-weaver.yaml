# Token Weaver dev config — vendored into the Memcard repo so the dev stack
# (docker-compose.dev.yml) is self-contained and needs no sibling checkout.
#
# This file is mounted read-only into the published Token Weaver image at
# /app/config/token-weaver.yaml. It defines test strategies that issue RS256
# JWTs Memcard verifies. The claims below become the Memcard identity:
#   sub -> userId (the player), app -> app (the {app} key segment).
#
# The `secret` values here are NON-SENSITIVE demo credentials: a secret only
# yields a usable token when signed by the RSA key in ./keys/, which is NOT
# committed (generate it with `yarn dev:keys`). Do not reuse these in any
# environment that is reachable by others.
strategies:
  - name: game-client
    type: direct
    credential_path: $.request.body.secret
    credentials:
      - secret: dev-secret
        claims:
          sub: player-001
          app: my-game
      - secret: secret-player-002
        claims:
          sub: player-002
          app: my-game
      - secret: secret-player-003
        claims:
          sub: player-003
          app: my-game
      - secret: secret-player-004
        claims:
          sub: player-004
          app: my-game
      - secret: secret-player-005
        claims:
          sub: player-005
          app: my-game
    jwt:
      algorithm: RS256
      issuer: token-weaver
      ttl: 3600

  - name: new-player
    type: direct
    credential_path: $.request.body.secret
    credentials:
      - secret: dev-secret
        claims:
          sub: demo-player
          app: demo-app
    jwt:
      algorithm: RS256
      issuer: token-weaver
      ttl: 3600

  # Players whose tokens carry per-path rules in their own claims, which is how
  # Memcard's `whitelistClaim` / `blacklistClaim` are meant to be driven: the auth
  # service decides per player what the token may reach, and Memcard only names
  # which claims to read.
  #
  # Deliberately NOT folded into `game-client` above — a token carrying neither
  # claim is the documented "unrestricted" case, and those five players are what
  # exercises it. Added for tests/verification/, which asserts both sides.
  - name: path-claims-player
    type: direct
    credential_path: $.request.body.secret
    credentials:
      - secret: secret-blacklisted
        claims:
          sub: player-blacklisted
          app: my-game
          blacklist:
            - /v1/memcard/me/*
      - secret: secret-whitelisted
        claims:
          sub: player-whitelisted
          app: my-game
          whitelist:
            - /v1/memcard/me/*
    jwt:
      algorithm: RS256
      issuer: token-weaver
      ttl: 3600

# The three places a secret may come from, side by side. They are not competing
# sources for one setting — each value names its own.
auth:
  # From the environment.
  - type: hs256
    issuer: https://from-env.test
    secret: ${env:TEST_PLAYER_SECRET}

  # From a mounted file. The fixture ends in a newline, which is stripped.
  - type: static
    token: ${file:tests/fixtures/static-token.secret}
    admin: true

  # Written inline — no placeholder at all.
  - type: hs256
    issuer: https://from-literal.test
    secret: literal-secret

  # A placeholder may also be one part of a larger value.
  - type: hs256
    issuer: https://${env:TEST_ISSUER_HOST}/realm
    secret: ${env:TEST_INTERNAL_SECRET}

# Compose overlay for the PayloadStash verification run.
#
# Layered on top of the normal dev stack, never used alone:
#
#   docker compose -f docker-compose.dev.yml -f tests/verification/docker-compose.verify.yml up -d
#
# (x-run-memcard-stash.sh does this for you.) Relative paths resolve against the
# project directory, which is the repo root because docker-compose.dev.yml is the
# first -f — hence the ./tests/verification/... prefixes below.
#
# It exists so the plain dev stack keeps working unchanged: `yarn dev` and a bare
# `docker compose -f docker-compose.dev.yml up` still run single-strategy env-var
# auth with the default key prefix. Nothing here leaks into that path.
services:
  memcard:
    environment:
      # The point of the exercise: prove a non-default prefix actually relocates
      # the tree. The bucket already holds memcard/ and custom-cms-prefix/, so a
      # run that writes under custom-memcard/ is visible proof the value is read.
      - MEMCARD_KEY_PREFIX=custom-memcard
      # Switches auth from the JWT_* env vars to the three-strategy config file.
      - MEMCARD_CONFIG_PATH=/app/verify/memcard-auth.yaml
      # Consumed by ${env:MEMCARD_STATIC_TOKEN} in that file. Generated per run by
      # the runner and exported before compose reads this — failing loudly here is
      # better than booting with a token nobody knows.
      - MEMCARD_STATIC_TOKEN=${MEMCARD_STATIC_TOKEN:?generated by x-run-memcard-stash.sh — run that instead of calling compose directly}
      - JWT_APP_CLAIM=app
    volumes:
      - ./tests/verification/config/memcard-auth.yaml:/app/verify/memcard-auth.yaml:ro
      # The HS256 secret as a mounted file, which is what ${file:...} is for. The
      # runner writes it before the stack comes up; Memcard reads it once at boot.
      - ./tests/verification/.run/hs256.secret:/run/secrets/memcard-hs256:ro
